name: GA4 booking tracking checks

on:
  pull_request:
    paths:
      - 'assets/booking-analytics.js'
      - 'assets/ga4-consent.js'
      - 'tests/ga4-booking.test.cjs'
      - 'tests/ga4-live-delivery.mjs'
      - '.github/workflows/ga4-booking-check.yml'
      - '.github/workflows/ga4-live-delivery.yml'
      - 'index.html'
      - 'styles/**'
  push:
    branches: [main]
    paths:
      - 'assets/booking-analytics.js'
      - 'assets/ga4-consent.js'
      - 'tests/ga4-booking.test.cjs'
      - 'tests/ga4-live-delivery.mjs'
      - '.github/workflows/ga4-booking-check.yml'
      - 'index.html'
      - 'styles/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracking-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check analytics modules and event routing
        run: |
          node --check assets/ga4-consent.js
          node --check assets/booking-analytics.js
          node --check tests/ga4-live-delivery.mjs
          node --test tests/ga4-booking.test.cjs
  public-site-delivery-diagnosis:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect live public GA4 network requests (intercept test hits)
        run: node tests/ga4-live-delivery.mjs
