name: iSH Failover Offline Regression

on:
  pull_request:
    branches: [ish-worker-stable]
    paths:
      - 'tools/ish-failover-coordinator.py'
      - 'tools/test-ish-failover-coordinator.py'
      - 'tools/ish-code-runner.py'
      - 'tools/test-ish-code-runner.py'
      - 'tools/actions-failure-diagnostic.py'
      - 'tools/test-actions-failure-diagnostic.py'
      - 'tools/actions-run-probe.py'
      - 'tools/test-actions-run-probe.py'
      - 'tools/start-ish-worker.sh'
      - 'tools/ish-runtime-status.py'
      - 'tools/test-ish-runtime-status.py'
      - 'tools/ish-bridge-v2.py'
      - '.github/workflows/ish-failover-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ish-failover-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Prepare same bridge import alias as iSH launcher
        run: cp tools/ish-bridge-v2.py tools/ish_bridge_v2.py
      - name: Verify Python syntax
        run: python3 -m py_compile tools/ish-bridge-v2.py tools/ish-failover-coordinator.py tools/ish-code-runner.py tools/test-ish-code-runner.py tools/test-ish-failover-coordinator.py tools/actions-failure-diagnostic.py tools/test-actions-failure-diagnostic.py tools/actions-run-probe.py tools/test-actions-run-probe.py tools/ish-runtime-status.py tools/test-ish-runtime-status.py
      - name: Run offline failover regression
        run: python3 tools/test-ish-failover-coordinator.py
      - name: Run offline code-runner regression
        run: python3 tools/test-ish-code-runner.py
      - name: Run Actions failure diagnosis regression
        run: python3 tools/test-actions-failure-diagnostic.py
      - name: Run Actions run probe regression
        run: python3 tools/test-actions-run-probe.py
      - name: Run iSH runtime status regression
        run: python3 tools/test-ish-runtime-status.py
      - name: Verify iSH launcher shell syntax
        run: sh -n tools/start-ish-worker.sh
